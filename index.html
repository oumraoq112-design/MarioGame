<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshot Monitor - Trojan Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1em;
        }

        .status {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 20px;
        }

        .status-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .status-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .status-value {
            font-size: 2em;
            font-weight: bold;
            color: #4ecdc4;
        }

        .latest-screenshot {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            padding-left: 15px;
            border-left: 4px solid #ff6b6b;
        }

        .screenshot-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .screenshot-container img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .no-screenshot {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1.2em;
        }

        .screenshot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .screenshot-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .screenshot-item:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(255, 107, 107, 0.3);
        }

        .screenshot-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .screenshot-info {
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
        }

        .screenshot-time {
            font-size: 0.85em;
            color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ff6b6b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-info {
            text-align: center;
            padding: 15px;
            background: rgba(78, 205, 196, 0.1);
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔴 Screenshot Monitor</h1>
            <p class="subtitle">Educational Trojan Demonstration</p>
        </header>

        <div class="status">
            <div class="status-card">
                <div class="status-label">Total Screenshots</div>
                <div class="status-value" id="total-count">0</div>
            </div>
            <div class="status-card">
                <div class="status-label">Last Update</div>
                <div class="status-value" id="last-update" style="font-size: 1.2em;">Never</div>
            </div>
            <div class="status-card">
                <div class="status-label">Status</div>
                <div class="status-value" id="status">Waiting...</div>
            </div>
        </div>

        <div class="refresh-info">
            🔄 Auto-refreshing every 30 seconds
        </div>

        <div class="latest-screenshot">
            <h2 class="section-title">Latest Screenshot</h2>
            <div class="screenshot-container" id="latest-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Waiting for screenshots...</p>
                </div>
            </div>
        </div>

        <div>
            <h2 class="section-title">All Screenshots</h2>
            <div class="screenshot-grid" id="screenshot-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lastScreenshotCount = 0;

        async function loadScreenshots() {
            try {
                const response = await fetch('/screenshots');
                const screenshots = await response.json();

                // Update status
                document.getElementById('total-count').textContent = screenshots.length;
                document.getElementById('status').textContent = screenshots.length > 0 ? 'Active' : 'Waiting...';
                
                if (screenshots.length > 0) {
                    const latest = screenshots[0];
                    document.getElementById('last-update').textContent = 
                        new Date(latest.timestamp).toLocaleTimeString();

                    // Display latest screenshot
                    const latestContainer = document.getElementById('latest-container');
                    latestContainer.innerHTML = `
                        <img src="${latest.url}" alt="Latest Screenshot">
                        <p style="text-align: center; margin-top: 10px; color: #aaa;">
                            Captured at ${new Date(latest.timestamp).toLocaleString()}
                        </p>
                    `;

                    // Display all screenshots in grid
                    const grid = document.getElementById('screenshot-grid');
                    grid.innerHTML = screenshots.map(shot => `
                        <div class="screenshot-item" onclick="window.open('${shot.url}', '_blank')">
                            <img src="${shot.url}" alt="Screenshot">
                            <div class="screenshot-info">
                                <div class="screenshot-time">
                                    ${new Date(shot.timestamp).toLocaleString()}
                                </div>
                            </div>
                        </div>
                    `).join('');

                    // Play sound if new screenshot
                    if (screenshots.length > lastScreenshotCount) {
                        console.log('New screenshot received!');
                    }
                    lastScreenshotCount = screenshots.length;
                } else {
                    document.getElementById('latest-container').innerHTML = `
                        <div class="no-screenshot">
                            <p>📸 No screenshots received yet</p>
                            <p style="font-size: 0.9em; margin-top: 10px; color: #888;">
                                Run the infected Mario game to start capturing screenshots
                            </p>
                        </div>
                    `;
                    document.getElementById('screenshot-grid').innerHTML = `
                        <div class="no-screenshot">Waiting for screenshots...</div>
                    `;
                }
            } catch (error) {
                console.error('Error loading screenshots:', error);
                document.getElementById('status').textContent = 'Error';
            }
        }

        // Load screenshots immediately
        loadScreenshots();

        // Auto-refresh every 30 seconds
        setInterval(loadScreenshots, 30000);

        // Also refresh every 5 seconds for more responsive demo
        setInterval(loadScreenshots, 5000);
    </script>
</body>
</html>
